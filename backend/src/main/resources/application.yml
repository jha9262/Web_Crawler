server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

spring:
  # MongoDB Data Configuration
  data:
    mongodb:
      # Production: Set MONGODB_URI as an environment variable
      # Local dev: copy .env.example to .env and populate values
      uri: ${MONGODB_URI}

# JWT Configuration — secret MUST be at least 64 characters
jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}      # 24h
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7d

# CORS — space-separated list of allowed origins
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging
logging:
  level:
    com.example.crawler: INFO
    org.springframework.security: WARN
    org.springframework.data.mongodb.core.MongoTemplate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
